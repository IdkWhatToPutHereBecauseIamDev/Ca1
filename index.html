<script>
(function() {
    const params = new URLSearchParams(window.location.search);
    const message = params.get('q') || "";

    if (!message.trim()) {
        document.getElementById("response-field").innerText = "Awaiting input...";
        return;
    }

    let rawInput = message.trim();
    let text = rawInput.toLowerCase();

    let brain = { "history": [] };
    try {
        const stored = localStorage.getItem('ai_global_memory');
        if (stored) brain = JSON.parse(stored);
    } catch (e) {
        // storage unavailable in this context, fall back to in-memory only
    }

    if (text === ".history") {
        if (brain.history.length === 0) {
            renderUI("Conversation history is empty.");
        } else {
            let timeline = brain.history.map(log => log.speaker + ": " + log.content).join(" | ");
            renderUI(timeline);
        }
        return;
    }

    let mathClean = text.replace(/plus/g, '+').replace(/minus/g, '-').replace(/times/g, '*').replace(/divided by/g, '/').replace(/x/g, '*').replace(/[^0-9\+\-\*\/\(\)\.]/g, '');
    if (/^[0-9\+\-\*\/\(\)\.]+$/.test(mathClean) && mathClean.length > 0) {
        try {
            let mathAns = eval(mathClean).toString();
            commitToMemory(rawInput, mathAns);
            renderUI(mathAns);
            return;
        } catch(e) {}
    }

    if (text.includes("what") && text.includes("time")) {
        let timeAns = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        commitToMemory(rawInput, timeAns);
        renderUI(timeAns);
        return;
    }
    if (text.includes("what") && text.includes("date")) {
        let dateAns = new Date().toLocaleDateString();
        commitToMemory(rawInput, dateAns);
        renderUI(dateAns);
        return;
    }

    if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
        commitToMemory(rawInput, "hello");
        renderUI("hello");
        return;
    }
    if (text.includes("status")) {
        commitToMemory(rawInput, "online");
        renderUI("online");
        return;
    }

    let targetQuery = encodeURIComponent(rawInput);
    let proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://html.duckduckgo.com/html/?q=" + targetQuery);

    let xhr = new XMLHttpRequest();
    xhr.open("GET", proxyUrl, true);
    xhr.onload = function() {
        try {
            let doc = new DOMParser().parseFromString(xhr.responseText, "text/html");
            let snippet = doc.querySelector(".result__snippet");

            if (snippet && snippet.innerText.trim().length > 0) {
                let ans = snippet.innerText.trim();
                if (ans.length > 150) ans = ans.substring(0, 145) + "...";
                commitToMemory(rawInput, ans);
                renderUI(ans);
            } else {
                renderUI("No plain answer found.");
            }
        } catch(e) {
            renderUI("Error decoding response.");
        }
    };
    xhr.onerror = function() { renderUI("Network error."); };
    xhr.send();

    function commitToMemory(userPrompt, aiResponse) {
        brain.history.push({ "speaker": "User", "content": userPrompt });
        brain.history.push({ "speaker": "AI", "content": aiResponse });
        if (brain.history.length > 20) {
            brain.history.shift();
            brain.history.shift();
        }
        try {
            localStorage.setItem('ai_global_memory', JSON.stringify(brain));
        } catch (e) {
            // storage unavailable, history just won't persist between runs
        }
    }

    function renderUI(finalAnswer) {
        document.getElementById("response-field").innerText = finalAnswer;
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.completionHandler) {
            window.webkit.messageHandlers.completionHandler.postMessage(finalAnswer);
        }
    }
})();
</script>
